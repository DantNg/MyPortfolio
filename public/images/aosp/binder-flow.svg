<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Một giao dịch Binder / One Binder transaction</text>

  <defs>
    <marker id="na" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4d7c0f"/>
    </marker>
    <marker id="nb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- three columns -->
  <rect x="24" y="56" width="200" height="200" rx="10" fill="#ecfccb" stroke="#a3e635" stroke-width="2"/>
  <text x="124" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#4d7c0f">client process</text>
  <rect x="44" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#a3e635"/>
  <text x="124" y="108" text-anchor="middle" font-size="11" font-family="monospace" fill="#3f3f46">ILedControl proxy</text>
  <text x="124" y="123" text-anchor="middle" font-size="9.5" fill="#71717a">generated stub</text>
  <rect x="44" y="142" width="160" height="46" rx="6" fill="#18181b"/>
  <text x="124" y="160" text-anchor="middle" font-size="10" font-family="monospace" fill="#a3e635">Parcel</text>
  <text x="124" y="176" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#e4e4e7">token · id · brightness</text>
  <text x="124" y="212" text-anchor="middle" font-size="10.5" fill="#b91c1c">calling thread BLOCKS here</text>
  <text x="124" y="232" text-anchor="middle" font-size="10" fill="#7f1d1d">on the UI thread this is an ANR</text>

  <!-- kernel -->
  <rect x="268" y="56" width="224" height="200" rx="10" fill="#18181b"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#a3e635">kernel — /dev/binder</text>
  <rect x="288" y="94" width="184" height="52" rx="6" fill="#27272a" stroke="#52525b"/>
  <text x="380" y="114" text-anchor="middle" font-size="11" font-family="monospace" fill="#e4e4e7">ioctl(BINDER_WRITE_READ)</text>
  <text x="380" y="133" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#facc15">ONE copy, sender → receiver</text>
  <text x="380" y="166" text-anchor="middle" font-size="10" font-family="monospace" fill="#a1a1aa">translates handles, so an IBinder or</text>
  <text x="380" y="182" text-anchor="middle" font-size="10" font-family="monospace" fill="#a1a1aa">an fd can travel inside the Parcel</text>
  <text x="380" y="208" text-anchor="middle" font-size="10" font-family="monospace" fill="#a1a1aa">attaches caller uid / pid — unforgeable</text>
  <text x="380" y="234" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#f87171">1 MB buffer, per PROCESS</text>

  <!-- server -->
  <rect x="536" y="56" width="200" height="200" rx="10" fill="#ecfccb" stroke="#a3e635" stroke-width="2"/>
  <text x="636" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#4d7c0f">server process</text>
  <rect x="556" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#a3e635"/>
  <text x="636" y="108" text-anchor="middle" font-size="11" font-family="monospace" fill="#3f3f46">onTransact()</text>
  <text x="636" y="123" text-anchor="middle" font-size="9.5" fill="#71717a">reads in the same order</text>

  <text x="636" y="152" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4d7c0f">thread pool — 15 + main</text>
  <g>
    <rect x="560" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="582" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="604" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="626" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="648" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="670" y="160" width="18" height="26" rx="3" fill="#65a30d"/>
    <rect x="692" y="160" width="18" height="26" rx="3" fill="#dc2626"/>
  </g>
  <text x="636" y="206" text-anchor="middle" font-size="10.5" fill="#b91c1c">all busy → caller 17 waits</text>
  <text x="636" y="226" text-anchor="middle" font-size="10" fill="#7f1d1d">so binder methods must be fast:</text>
  <text x="636" y="240" text-anchor="middle" font-size="10" fill="#7f1d1d">hand slow work to your own thread</text>

  <g stroke="#4d7c0f" stroke-width="2.5" marker-end="url(#na)">
    <line x1="228" y1="116" x2="262" y2="116"/>
    <line x1="496" y1="116" x2="530" y2="116"/>
  </g>
  <g stroke="#0891b2" stroke-width="2.5" marker-end="url(#nb)">
    <line x1="530" y1="140" x2="496" y2="140"/>
    <line x1="262" y1="140" x2="228" y2="140"/>
  </g>
  <text x="245" y="110" text-anchor="middle" font-size="9" fill="#4d7c0f">→</text>

  <!-- bottom rows -->
  <rect x="24" y="274" width="352" height="106" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="44" y="296" font-size="12" font-weight="700" fill="#b91c1c">TransactionTooLargeException</text>
  <text x="44" y="318" font-size="10.5" fill="#7f1d1d">1 MB is shared by every concurrent transaction in</text>
  <text x="44" y="334" font-size="10.5" fill="#7f1d1d">the process — 500 KB works idle, fails under load.</text>
  <text x="44" y="358" font-size="10.5" font-weight="600" fill="#991b1b">Instead: paginate · ParcelFileDescriptor · ashmem</text>

  <rect x="392" y="274" width="344" height="106" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="412" y="296" font-size="12" font-weight="700" fill="#15803d">linkToDeath — never skip it</text>
  <text x="412" y="318" font-size="10.5" fill="#166534">Services get killed: lmkd, a crash, an update.</text>
  <text x="412" y="334" font-size="10.5" fill="#166534">A client that does not notice is broken forever.</text>
  <text x="412" y="358" font-size="10.5" font-family="monospace" fill="#3f3f46">AIBinder_linkToDeath(binder, recipient, this)</text>
</svg>
