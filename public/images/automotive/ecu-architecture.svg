<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Kiến trúc E/E — từ phân tán tới zonal</text>

  <!-- domain -->
  <rect x="24" y="52" width="344" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="196" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Hôm qua: theo miền chức năng</text>
  <text x="196" y="93" text-anchor="middle" font-size="10" fill="#71717a">60–120 ECU, mỗi ECU một hộp, dây rất nhiều</text>

  <rect x="150" y="108" width="92" height="34" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="196" y="130" text-anchor="middle" font-size="10.5" fill="#1e40af">Gateway</text>

  <rect x="44" y="170" width="90" height="46" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="89" y="189" text-anchor="middle" font-size="10" fill="#27272a">Powertrain</text>
  <text x="89" y="204" text-anchor="middle" font-size="8.5" fill="#71717a">ECM, TCU</text>

  <rect x="150" y="170" width="92" height="46" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="196" y="189" text-anchor="middle" font-size="10" fill="#27272a">Chassis</text>
  <text x="196" y="204" text-anchor="middle" font-size="8.5" fill="#71717a">ABS, EPS</text>

  <rect x="258" y="170" width="90" height="46" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="303" y="189" text-anchor="middle" font-size="10" fill="#27272a">Body</text>
  <text x="303" y="204" text-anchor="middle" font-size="8.5" fill="#71717a">BCM, cửa</text>

  <rect x="97" y="240" width="90" height="46" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="142" y="259" text-anchor="middle" font-size="10" fill="#27272a">Infotainment</text>
  <text x="142" y="274" text-anchor="middle" font-size="8.5" fill="#71717a">IVI, cụm đồng hồ</text>

  <rect x="205" y="240" width="90" height="46" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="250" y="259" text-anchor="middle" font-size="10" fill="#27272a">ADAS</text>
  <text x="250" y="274" text-anchor="middle" font-size="8.5" fill="#71717a">camera, radar</text>

  <g stroke="#a1a1aa" stroke-width="1.4" fill="none">
    <path d="M89 170 L89 150 L150 150"/>
    <path d="M196 170 L196 142"/>
    <path d="M303 170 L303 150 L242 150"/>
    <path d="M142 240 L142 226 L196 226 L196 142"/>
    <path d="M250 240 L250 226 L196 226"/>
  </g>

  <text x="196" y="316" text-anchor="middle" font-size="10.5" fill="#b45309">• dây dài, nặng, đắt</text>
  <text x="196" y="334" text-anchor="middle" font-size="10.5" fill="#b45309">• mỗi ECU một nhà cung cấp, một bản cập nhật</text>
  <text x="196" y="352" text-anchor="middle" font-size="10.5" fill="#b45309">• thêm tính năng = thêm một hộp nữa</text>
  <text x="196" y="370" text-anchor="middle" font-size="10.5" fill="#3f3f46">Mạng: CAN · LIN · FlexRay · MOST</text>

  <!-- zonal -->
  <rect x="392" y="52" width="344" height="330" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="564" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Hôm nay: zonal + máy tính trung tâm</text>
  <text x="564" y="93" text-anchor="middle" font-size="10" fill="#71717a">vài chục ECU, gom theo VỊ TRÍ trên xe</text>

  <rect x="474" y="140" width="180" height="60" rx="9" fill="#2563eb"/>
  <text x="564" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">HPC — máy tính trung tâm</text>
  <text x="564" y="182" text-anchor="middle" font-size="9.5" fill="#dbeafe">SoC nhiều nhân · Linux/QNX · Adaptive</text>

  <rect x="412" y="240" width="90" height="44" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="457" y="260" text-anchor="middle" font-size="10" fill="#27272a">Zone trước</text>
  <text x="457" y="275" text-anchor="middle" font-size="8.5" fill="#71717a">đèn, radar, quạt</text>

  <rect x="518" y="240" width="90" height="44" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="563" y="260" text-anchor="middle" font-size="10" fill="#27272a">Zone giữa</text>
  <text x="563" y="275" text-anchor="middle" font-size="8.5" fill="#71717a">ghế, cửa, HVAC</text>

  <rect x="624" y="240" width="90" height="44" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="669" y="260" text-anchor="middle" font-size="10" fill="#27272a">Zone sau</text>
  <text x="669" y="275" text-anchor="middle" font-size="8.5" fill="#71717a">cốp, cảm biến lùi</text>

  <g stroke="#16a34a" stroke-width="2" fill="none">
    <path d="M457 240 L457 220 L564 220 L564 202"/>
    <path d="M563 240 L563 220"/>
    <path d="M669 240 L669 220 L564 220"/>
  </g>
  <text x="600" y="216" font-size="9" font-family="monospace" fill="#15803d">Automotive Ethernet</text>

  <text x="564" y="316" text-anchor="middle" font-size="10.5" fill="#15803d">• dây ngắn lại — nhẹ và rẻ hơn nhiều</text>
  <text x="564" y="334" text-anchor="middle" font-size="10.5" fill="#15803d">• tính năng là phần mềm, cập nhật OTA</text>
  <text x="564" y="352" text-anchor="middle" font-size="10.5" fill="#15803d">• zone chỉ làm I/O; logic nằm ở HPC</text>
  <text x="564" y="370" text-anchor="middle" font-size="10.5" fill="#3f3f46">Mạng: Ethernet 100/1000BASE-T1 + CAN FD ở biên</text>
</svg>
