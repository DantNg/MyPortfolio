<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="640" cy="330" rx="430" ry="300" fill="url(#glow)"/>

  <!-- lưới nền mờ -->
  <g stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M90 0v675M180 0v675M270 0v675M360 0v675M450 0v675M540 0v675M630 0v675M720 0v675M810 0v675M900 0v675M990 0v675M1080 0v675"/>
  </g>

  <!-- ===== các cạnh mesh ===== -->
  <g stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="2.5">
    <line x1="300" y1="240" x2="470" y2="180"/>
    <line x1="300" y1="240" x2="450" y2="360"/>
    <line x1="470" y1="180" x2="640" y2="230"/>
    <line x1="450" y1="360" x2="640" y2="230"/>
    <line x1="450" y1="360" x2="620" y2="450"/>
    <line x1="640" y1="230" x2="810" y2="180"/>
    <line x1="640" y1="230" x2="620" y2="450"/>
    <line x1="620" y1="450" x2="800" y2="410"/>
    <line x1="810" y1="180" x2="960" y2="260"/>
    <line x1="800" y1="410" x2="960" y2="260"/>
  </g>

  <!-- cạnh tới low-power node: nét đứt (chỉ nói chuyện qua friend) -->
  <g stroke="#a1a1aa" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 7">
    <line x1="960" y1="260" x2="1075" y2="360"/>
    <line x1="300" y1="240" x2="200" y2="150"/>
  </g>

  <!-- ===== gói tin đang lan (managed flooding) ===== -->
  <g fill="#7c3aed">
    <circle cx="386" cy="209" r="6.5" opacity="0.95"/>
    <circle cx="556" cy="204" r="6.5" opacity="0.8"/>
    <circle cx="726" cy="204" r="6.5" opacity="0.62"/>
    <circle cx="536" cy="298" r="6.5" opacity="0.8"/>
    <circle cx="712" cy="428" r="6.5" opacity="0.62"/>
  </g>

  <!-- ===== node ===== -->
  <!-- provisioner / gateway -->
  <g>
    <circle cx="640" cy="230" r="34" fill="#7c3aed"/>
    <circle cx="640" cy="230" r="34" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="640" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">GW</text>
  </g>

  <!-- relay node -->
  <g fill="#ffffff" stroke="#8b5cf6" stroke-width="4">
    <circle cx="470" cy="180" r="25"/>
    <circle cx="300" cy="240" r="25"/>
    <circle cx="450" cy="360" r="25"/>
    <circle cx="810" cy="180" r="25"/>
    <circle cx="620" cy="450" r="25"/>
  </g>
  <g fill="#7c3aed" font-size="13" font-weight="600" text-anchor="middle">
    <text x="470" y="185">R</text>
    <text x="300" y="245">R</text>
    <text x="450" y="365">R</text>
    <text x="810" y="185">R</text>
    <text x="620" y="455">R</text>
  </g>

  <!-- friend node -->
  <g>
    <rect x="932" y="232" width="56" height="56" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="4"/>
    <text x="960" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">F</text>
    <rect x="772" y="382" width="56" height="56" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="4"/>
    <text x="800" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">F</text>
  </g>

  <!-- low power node -->
  <g>
    <rect x="1050" y="336" width="50" height="50" rx="12" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="3.5"/>
    <text x="1075" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#52525b">LPN</text>
    <rect x="175" y="126" width="50" height="50" rx="12" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="3.5"/>
    <text x="200" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#52525b">LPN</text>
  </g>

  <!-- ===== nhãn ===== -->
  <g>
    <rect x="72" y="72" width="152" height="34" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="94" cy="89" r="5" fill="#7c3aed"/>
    <text x="108" y="94" font-size="15" font-weight="600" fill="#6d28d9">BLE Mesh</text>
  </g>

  <text x="72" y="596" font-size="45" font-weight="700" fill="#18181b">Managed flooding,</text>
  <text x="72" y="646" font-size="45" font-weight="700" fill="#7c3aed">friend &amp; LPN</text>

  <!-- chú giải -->
  <g font-size="16" fill="#52525b">
    <circle cx="812" cy="576" r="9" fill="#7c3aed"/>
    <text x="832" y="582">Relay</text>
    <rect x="900" y="567" width="18" height="18" rx="5" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
    <text x="928" y="582">Friend</text>
    <rect x="1002" y="567" width="18" height="18" rx="5" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="3"/>
    <text x="1030" y="582">Low power</text>
  </g>
</svg>
