<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <ellipse cx="620" cy="300" rx="470" ry="290" fill="url(#glow2)"/>

  <g stroke="#2563eb" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/>
  </g>

  <!-- nhãn -->
  <g>
    <rect x="72" y="66" width="164" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="94" cy="83" r="5" fill="#2563eb"/>
    <text x="108" y="88" font-size="15" font-weight="600" fill="#1d4ed8">FreeRTOS</text>
  </g>

  <!-- ===== dòng thời gian lập lịch ===== -->
  <g font-size="17" font-weight="600">
    <text x="176" y="184" text-anchor="end" fill="#dc2626">P6</text>
    <text x="176" y="256" text-anchor="end" fill="#2563eb">P4</text>
    <text x="176" y="328" text-anchor="end" fill="#0891b2">P2</text>
    <text x="176" y="400" text-anchor="end" fill="#71717a">IDLE</text>
  </g>

  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="196" y1="196" x2="1128" y2="196"/>
    <line x1="196" y1="268" x2="1128" y2="268"/>
    <line x1="196" y1="340" x2="1128" y2="340"/>
    <line x1="196" y1="412" x2="1128" y2="412"/>
  </g>

  <!-- P2: chạy rồi bị giành quyền -->
  <rect x="196" y="308" width="150" height="30" rx="6" fill="#67e8f9"/>
  <rect x="640" y="308" width="130" height="30" rx="6" fill="#67e8f9"/>
  <rect x="960" y="308" width="168" height="30" rx="6" fill="#67e8f9"/>

  <!-- P4 -->
  <rect x="346" y="236" width="128" height="30" rx="6" fill="#60a5fa"/>
  <rect x="770" y="236" width="190" height="30" rx="6" fill="#60a5fa"/>

  <!-- P6: ISR đánh thức, giành quyền ngay -->
  <rect x="474" y="164" width="166" height="30" rx="6" fill="#f87171"/>

  <!-- IDLE -->
  <rect x="196" y="380" width="0" height="30" rx="6" fill="#e4e4e7"/>

  <!-- mũi tên giành quyền -->
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <path d="M474 300 L474 200"/>
    <path d="M468 208 L474 196 L480 208" fill="#dc2626" stroke="none"/>
  </g>
  <text x="474" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">ISR → preempt</text>

  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <path d="M346 302 L346 272"/>
    <path d="M340 280 L346 268 L352 280" fill="#2563eb" stroke="none"/>
  </g>

  <!-- vạch tick -->
  <g stroke="#a1a1aa" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="346" y1="150" x2="346" y2="426"/>
    <line x1="474" y1="150" x2="474" y2="426"/>
    <line x1="640" y1="150" x2="640" y2="426"/>
    <line x1="770" y1="150" x2="770" y2="426"/>
    <line x1="960" y1="150" x2="960" y2="426"/>
  </g>
  <text x="1128" y="452" text-anchor="end" font-size="14" fill="#71717a">SysTick 1 kHz →</text>

  <!-- tiêu đề -->
  <text x="72" y="562" font-size="46" font-weight="700" fill="#18181b">Fixed-priority</text>
  <text x="72" y="614" font-size="46" font-weight="700" fill="#2563eb">preemption</text>
  <text x="74" y="650" font-size="19" fill="#52525b">scheduler internals · priority inversion · patterns</text>

  <!-- khối trạng thái -->
  <g>
    <rect x="792" y="514" width="336" height="120" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="816" y="548" font-size="15" font-weight="700" fill="#18181b">Task states</text>
    <g font-size="14.5" fill="#3f3f46">
      <circle cx="824" cy="576" r="6" fill="#2563eb"/><text x="840" y="581">Running</text>
      <circle cx="944" cy="576" r="6" fill="#60a5fa"/><text x="960" y="581">Ready</text>
      <circle cx="824" cy="608" r="6" fill="#fbbf24"/><text x="840" y="613">Blocked</text>
      <circle cx="944" cy="608" r="6" fill="#a1a1aa"/><text x="960" y="613">Suspended</text>
    </g>
  </g>
</svg>
