<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.65" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <ellipse cx="780" cy="320" rx="430" ry="300" fill="url(#glow3)"/>

  <g stroke="#0891b2" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/>
  </g>

  <!-- nhãn -->
  <g>
    <rect x="72" y="66" width="146" height="34" rx="17" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
    <circle cx="94" cy="83" r="5" fill="#0891b2"/>
    <text x="108" y="88" font-size="15" font-weight="600" fill="#0e7490">Zephyr</text>
  </g>

  <!-- ===== quy trình west ===== -->
  <g>
    <rect x="72" y="140" width="188" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="166" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#27272a">west init</text>
    <text x="166" y="191" text-anchor="middle" font-size="13" fill="#71717a">fetch manifest</text>

    <rect x="286" y="140" width="188" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="380" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#27272a">west update</text>
    <text x="380" y="191" text-anchor="middle" font-size="13" fill="#71717a">module + HAL</text>

    <rect x="500" y="140" width="188" height="66" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2.5"/>
    <text x="594" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#0e7490">west build</text>
    <text x="594" y="191" text-anchor="middle" font-size="13" fill="#3f3f46">-b nrf52840dk</text>

    <rect x="714" y="140" width="188" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="808" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#27272a">west flash</text>
    <text x="808" y="191" text-anchor="middle" font-size="13" fill="#71717a">via J-Link</text>

    <g stroke="#0891b2" stroke-width="2.5" marker-end="url(#ar3)">
      <line x1="262" y1="173" x2="282" y2="173"/>
      <line x1="476" y1="173" x2="496" y2="173"/>
      <line x1="690" y1="173" x2="710" y2="173"/>
    </g>
  </g>

  <!-- ===== xếp tầng Zephyr ===== -->
  <g>
    <rect x="72" y="252" width="560" height="52" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="94" y="284" font-size="16" font-weight="600" fill="#0e7490">Application — main.c · prj.conf</text>

    <rect x="72" y="314" width="560" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="94" y="346" font-size="16" font-weight="600" fill="#27272a">Subsystems — BLE host · net · settings · logging</text>

    <rect x="72" y="376" width="560" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="94" y="408" font-size="16" font-weight="600" fill="#27272a">Kernel — k_thread · k_msgq · k_mutex</text>

    <rect x="72" y="438" width="560" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="94" y="470" font-size="16" font-weight="600" fill="#27272a">Devicetree + drivers — 500+ boards</text>

    <rect x="72" y="500" width="560" height="34" rx="8" fill="#27272a"/>
    <text x="352" y="523" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e4e4e7">nRF52840 — Cortex-M4F · BLE 5</text>
  </g>

  <!-- ===== board nRF52840 DK ===== -->
  <g>
    <rect x="700" y="262" width="420" height="272" rx="18" fill="#1e3a8a"/>
    <rect x="718" y="280" width="384" height="236" rx="10" fill="#1e40af" opacity="0.55"/>

    <!-- SoC -->
    <rect x="836" y="330" width="140" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="906" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">nRF52840</text>
    <text x="906" y="418" text-anchor="middle" font-size="13" fill="#64748b">QIAA</text>
    <circle cx="856" cy="350" r="5" fill="#475569"/>

    <!-- chân -->
    <g fill="#94a3b8">
      <rect x="746" y="330" width="70" height="7" rx="3"/>
      <rect x="746" y="352" width="70" height="7" rx="3"/>
      <rect x="746" y="374" width="70" height="7" rx="3"/>
      <rect x="746" y="396" width="70" height="7" rx="3"/>
      <rect x="746" y="418" width="70" height="7" rx="3"/>
      <rect x="746" y="440" width="70" height="7" rx="3"/>
      <rect x="996" y="330" width="70" height="7" rx="3"/>
      <rect x="996" y="352" width="70" height="7" rx="3"/>
      <rect x="996" y="374" width="70" height="7" rx="3"/>
      <rect x="996" y="396" width="70" height="7" rx="3"/>
      <rect x="996" y="418" width="70" height="7" rx="3"/>
      <rect x="996" y="440" width="70" height="7" rx="3"/>
    </g>

    <!-- ăng-ten BLE -->
    <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.9">
      <path d="M1046 300 a 26 26 0 0 1 0 44"/>
      <path d="M1062 288 a 44 44 0 0 1 0 68"/>
    </g>
    <circle cx="1038" cy="322" r="5" fill="#22d3ee"/>

    <!-- LED -->
    <g>
      <circle cx="760" cy="492" r="8" fill="#4ade80"/>
      <circle cx="788" cy="492" r="8" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="816" cy="492" r="8" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="844" cy="492" r="8" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
    </g>
    <text x="910" y="498" font-size="13" fill="#93c5fd">nRF52840 DK</text>
  </g>

  <!-- tiêu đề -->
  <text x="72" y="596" font-size="44" font-weight="700" fill="#18181b">First BLE app on</text>
  <text x="72" y="646" font-size="44" font-weight="700" fill="#0e7490">Nordic nRF52840</text>
</svg>
