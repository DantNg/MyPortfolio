<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Cross-compile — build ở đây, chạy ở kia</text>

  <defs>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- host -->
  <rect x="30" y="58" width="320" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">HOST — máy build (x86_64)</text>

  <rect x="52" y="98" width="276" height="42" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="66" y="116" font-size="10.5" font-family="monospace" fill="#27272a">main.c  Makefile  CMakeLists.txt</text>
  <text x="66" y="132" font-size="10" fill="#71717a">mã nguồn của bạn / your source</text>

  <rect x="52" y="152" width="276" height="42" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="66" y="170" font-size="10.5" font-family="monospace" fill="#27272a">arm-linux-gnueabihf-gcc</text>
  <text x="66" y="186" font-size="10" fill="#71717a">toolchain: chạy trên x86, sinh mã ARM</text>

  <rect x="52" y="206" width="276" height="42" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="66" y="224" font-size="10.5" font-family="monospace" fill="#27272a">sysroot/ — headers + .so của target</text>
  <text x="66" y="240" font-size="10" fill="#71717a">để linker biết libc của board trông thế nào</text>

  <!-- target -->
  <rect x="430" y="58" width="300" height="200" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="580" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">TARGET — board (ARM)</text>

  <rect x="452" y="98" width="256" height="42" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="466" y="116" font-size="10.5" font-family="monospace" fill="#27272a">./sensord</text>
  <text x="466" y="132" font-size="10" fill="#71717a">nhị phân ARM, không chạy được trên host</text>

  <rect x="452" y="152" width="256" height="96" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="466" y="172" font-size="10.5" font-family="monospace" fill="#27272a">/dev/i2c-1   /dev/gpiochip0</text>
  <text x="466" y="190" font-size="10.5" font-family="monospace" fill="#27272a">/sys/class/pwm/...</text>
  <text x="466" y="212" font-size="10" fill="#71717a">phần cứng lộ ra dưới dạng file —</text>
  <text x="466" y="228" font-size="10" fill="#71717a">userspace mở/ghi bình thường</text>
  <text x="466" y="244" font-size="10" fill="#71717a">hardware exposed as files</text>

  <line x1="354" y1="130" x2="424" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#ca)"/>
  <text x="389" y="112" text-anchor="middle" font-size="10" font-family="monospace" fill="#2563eb">scp</text>

  <!-- checks -->
  <rect x="30" y="278" width="700" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="302" font-size="12.5" font-weight="700" fill="#18181b">Kiểm tra nhanh / quick checks</text>
  <g font-family="monospace" font-size="10.5" fill="#27272a">
    <text x="52" y="326">file sensord</text>
    <text x="52" y="348">arm-linux-gnueabihf-readelf -d sensord</text>
    <text x="392" y="326">uname -m</text>
    <text x="392" y="348">ldd sensord   (chạy trên board)</text>
  </g>
  <g font-family="Inter" font-size="10" fill="#71717a">
    <text x="170" y="326">"ELF 32-bit ARM" là đúng</text>
    <text x="330" y="348">xem thư viện động cần có</text>
    <text x="470" y="326">kiến trúc của board</text>
    <text x="600" y="348">thiếu .so là lộ ra ngay</text>
  </g>
</svg>
