<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Ba cách cài phần mềm / Three ways to get software</text>

  <rect x="24" y="54" width="230" height="252" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="139" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">1. Package manager</text>
  <rect x="44" y="94" width="190" height="88" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <g font-family="monospace" font-size="10.5" fill="#27272a">
    <text x="58" y="114">sudo apt update</text>
    <text x="58" y="132">sudo apt install gcc</text>
    <text x="58" y="150">apt search i2c</text>
    <text x="58" y="168">apt list --installed</text>
  </g>
  <text x="139" y="204" text-anchor="middle" font-size="11" fill="#16a34a">tự lo phụ thuộc</text>
  <text x="139" y="220" text-anchor="middle" font-size="11" fill="#16a34a">gỡ sạch được</text>
  <text x="139" y="240" text-anchor="middle" font-size="11" fill="#b45309">phiên bản hơi cũ</text>
  <text x="139" y="272" text-anchor="middle" font-size="10.5" fill="#52525b">dnf/yum · pacman · apk</text>
  <text x="139" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Mặc định nên dùng</text>

  <rect x="265" y="54" width="230" height="252" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">2. Build từ source</text>
  <rect x="285" y="94" width="190" height="88" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <g font-family="monospace" font-size="10.5" fill="#27272a">
    <text x="299" y="114">git clone ...</text>
    <text x="299" y="132">./configure --prefix=...</text>
    <text x="299" y="150">make -j$(nproc)</text>
    <text x="299" y="168">sudo make install</text>
  </g>
  <text x="380" y="204" text-anchor="middle" font-size="11" fill="#16a34a">phiên bản mới nhất</text>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#16a34a">bật/tắt tính năng</text>
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#dc2626">tự lo phụ thuộc</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#dc2626">khó gỡ sạch</text>
  <text x="380" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Khi cần bản mới / vá lỗi</text>

  <rect x="506" y="54" width="230" height="252" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="621" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">3. Nhị phân rời</text>
  <rect x="526" y="94" width="190" height="88" rx="8" fill="#ffffff" stroke="#fef08a"/>
  <g font-family="monospace" font-size="10.5" fill="#27272a">
    <text x="540" y="114">tar xf tool.tar.gz</text>
    <text x="540" y="132">mv tool ~/.local/bin</text>
    <text x="540" y="150">chmod +x ~/.local/bin/tool</text>
    <text x="540" y="168">export PATH=$PATH:...</text>
  </g>
  <text x="621" y="204" text-anchor="middle" font-size="11" fill="#16a34a">không cần sudo</text>
  <text x="621" y="220" text-anchor="middle" font-size="11" fill="#16a34a">nhiều bản song song</text>
  <text x="621" y="240" text-anchor="middle" font-size="11" fill="#b45309">tự cập nhật thủ công</text>
  <text x="621" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#a16207">Toolchain ARM, SDK hãng</text>
</svg>
