<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Ba dòng và cái ống — stdin, stdout, stderr</text>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="pr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- one process -->
  <text x="380" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Mỗi tiến trình có 3 kênh mặc định</text>

  <rect x="290" y="82" width="180" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">process</text>
  <text x="380" y="132" text-anchor="middle" font-size="10.5" fill="#3f3f46">grep, sort, ./app…</text>

  <text x="120" y="112" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#27272a">stdin (0)</text>
  <text x="120" y="128" text-anchor="middle" font-size="10" fill="#71717a">bàn phím / file</text>
  <line x1="180" y1="112" x2="286" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#pa)"/>

  <text x="640" y="102" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#27272a">stdout (1)</text>
  <text x="640" y="118" text-anchor="middle" font-size="10" fill="#71717a">kết quả bình thường</text>
  <line x1="474" y1="102" x2="576" y2="102" stroke="#2563eb" stroke-width="2" marker-end="url(#pa)"/>

  <text x="640" y="140" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#dc2626">stderr (2)</text>
  <text x="640" y="156" text-anchor="middle" font-size="10" fill="#71717a">thông báo lỗi</text>
  <line x1="474" y1="140" x2="576" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#pr)"/>

  <!-- pipeline -->
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Nối stdout của lệnh này vào stdin của lệnh kia — đó là |</text>

  <rect x="34" y="218" width="150" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="109" y="242" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#27272a">dmesg</text>
  <text x="109" y="258" text-anchor="middle" font-size="9.5" fill="#71717a">log kernel</text>

  <rect x="212" y="218" width="160" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="292" y="242" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#27272a">grep -i usb</text>
  <text x="292" y="258" text-anchor="middle" font-size="9.5" fill="#71717a">lọc dòng</text>

  <rect x="400" y="218" width="150" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="475" y="242" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#27272a">tail -20</text>
  <text x="475" y="258" text-anchor="middle" font-size="9.5" fill="#71717a">20 dòng cuối</text>

  <rect x="578" y="218" width="150" height="52" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="653" y="242" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#15803d">&gt; out.txt</text>
  <text x="653" y="258" text-anchor="middle" font-size="9.5" fill="#71717a">ghi ra file</text>

  <line x1="184" y1="244" x2="208" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="372" y1="244" x2="396" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="550" y1="244" x2="574" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#pa)"/>
  <text x="196" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">|</text>
  <text x="384" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">|</text>

  <!-- redirection table -->
  <rect x="34" y="304" width="694" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="monospace" font-size="11.5" fill="#27272a">
    <text x="56" y="328">cmd &gt; f</text>
    <text x="56" y="350">cmd &gt;&gt; f</text>
    <text x="56" y="372">cmd &lt; f</text>
    <text x="290" y="328">cmd 2&gt; err.log</text>
    <text x="290" y="350">cmd &gt; all 2&gt;&amp;1</text>
    <text x="290" y="372">cmd 2&gt;/dev/null</text>
  </g>
  <g font-family="Inter" font-size="10.5" fill="#52525b">
    <text x="140" y="328">ghi đè stdout vào file</text>
    <text x="150" y="350">nối thêm vào cuối file</text>
    <text x="140" y="372">lấy file làm stdin</text>
    <text x="430" y="328">chỉ chuyển hướng lỗi</text>
    <text x="440" y="350">gộp lỗi vào chung stdout</text>
    <text x="440" y="372">vứt lỗi đi cho đỡ ồn</text>
  </g>
</svg>
