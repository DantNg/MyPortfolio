<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Làm việc từ xa: SSH + systemd</text>

  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- laptop -->
  <rect x="34" y="60" width="200" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="134" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Máy của bạn</text>
  <rect x="54" y="98" width="160" height="62" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <g font-family="monospace" font-size="10" fill="#27272a">
    <text x="66" y="118">~/.ssh/id_ed25519</text>
    <text x="66" y="134" fill="#71717a">khoá riêng — không</text>
    <text x="66" y="148" fill="#71717a">bao giờ rời máy này</text>
  </g>

  <!-- target -->
  <rect x="526" y="60" width="200" height="120" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="626" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Board / server</text>
  <rect x="546" y="98" width="160" height="62" rx="7" fill="#ffffff" stroke="#bbf7d0"/>
  <g font-family="monospace" font-size="10" fill="#27272a">
    <text x="558" y="118">~/.ssh/authorized_keys</text>
    <text x="558" y="134" fill="#71717a">khoá công khai</text>
    <text x="558" y="148" fill="#71717a">ssh-copy-id đưa lên</text>
  </g>

  <line x1="238" y1="106" x2="520" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#sa)"/>
  <text x="379" y="98" text-anchor="middle" font-size="11" font-family="monospace" fill="#2563eb">ssh pi@192.168.1.20</text>
  <line x1="520" y1="140" x2="240" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#sa)"/>
  <text x="379" y="158" text-anchor="middle" font-size="11" font-family="monospace" fill="#2563eb">scp pi@board:/var/log/app.log .</text>

  <!-- systemd unit -->
  <rect x="34" y="204" width="360" height="160" rx="10" fill="#18181b"/>
  <text x="54" y="228" font-size="11" font-family="monospace" fill="#fbbf24">/etc/systemd/system/sensor.service</text>
  <g font-family="monospace" font-size="10.5" fill="#e4e4e7">
    <text x="54" y="252" fill="#60a5fa">[Unit]</text>
    <text x="54" y="268">Description=Sensor logger</text>
    <text x="54" y="284">After=network-online.target</text>
    <text x="54" y="304" fill="#60a5fa">[Service]</text>
    <text x="54" y="320">ExecStart=/usr/local/bin/sensord</text>
    <text x="54" y="336">Restart=always</text>
    <text x="54" y="352" fill="#60a5fa">[Install]<tspan fill="#e4e4e7">  WantedBy=multi-user.target</tspan></text>
  </g>

  <!-- lifecycle -->
  <rect x="414" y="204" width="312" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="570" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Vòng đời một service</text>
  <g font-family="monospace" font-size="10.5" fill="#27272a">
    <text x="436" y="252">systemctl daemon-reload</text>
    <text x="436" y="274">systemctl enable --now sensor</text>
    <text x="436" y="296">systemctl status sensor</text>
    <text x="436" y="318">journalctl -u sensor -f</text>
    <text x="436" y="340">systemctl restart sensor</text>
  </g>
  <g font-family="Inter" font-size="9.5" fill="#71717a">
    <text x="628" y="252">nạp lại unit</text>
    <text x="640" y="274">bật + chạy ngay</text>
    <text x="628" y="296">còn sống không?</text>
    <text x="640" y="318">xem log realtime</text>
  </g>
</svg>
