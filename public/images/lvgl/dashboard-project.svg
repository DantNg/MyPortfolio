<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Dự án cuối / Final project — Sensor Dashboard 320×240</text>

  <!-- device bezel -->
  <rect x="140" y="52" width="480" height="330" rx="18" fill="#27272a"/>
  <rect x="160" y="72" width="440" height="290" rx="8" fill="#f4f4f5"/>

  <!-- top bar -->
  <rect x="160" y="72" width="440" height="40" rx="8" fill="#2563eb"/>
  <rect x="160" y="100" width="440" height="12" fill="#2563eb"/>
  <text x="180" y="98" font-size="14" font-weight="600" fill="#ffffff">Sensor Dashboard</text>
  <circle cx="560" cy="92" r="6" fill="#4ade80"/>
  <text x="540" y="96" text-anchor="end" font-size="11" fill="#dbeafe">LIVE</text>

  <!-- cards row -->
  <rect x="176" y="128" width="130" height="76" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="192" y="150" font-size="10.5" fill="#71717a">TEMPERATURE</text>
  <text x="192" y="180" font-size="24" font-weight="700" fill="#18181b">27.4</text>
  <text x="252" y="180" font-size="12" fill="#71717a">°C</text>
  <rect x="192" y="190" width="98" height="5" rx="2.5" fill="#e4e4e7"/>
  <rect x="192" y="190" width="62" height="5" rx="2.5" fill="#2563eb"/>

  <rect x="315" y="128" width="130" height="76" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="331" y="150" font-size="10.5" fill="#71717a">HUMIDITY</text>
  <text x="331" y="180" font-size="24" font-weight="700" fill="#18181b">61</text>
  <text x="371" y="180" font-size="12" fill="#71717a">%</text>
  <rect x="331" y="190" width="98" height="5" rx="2.5" fill="#e4e4e7"/>
  <rect x="331" y="190" width="60" height="5" rx="2.5" fill="#0891b2"/>

  <!-- arc gauge -->
  <rect x="454" y="128" width="130" height="76" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <path d="M481 190 A 38 38 0 0 1 557 190" fill="none" stroke="#e4e4e7" stroke-width="9" stroke-linecap="round"/>
  <path d="M481 190 A 38 38 0 0 1 542 160" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
  <text x="519" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">72%</text>
  <text x="519" y="150" text-anchor="middle" font-size="10.5" fill="#71717a">LOAD</text>

  <!-- chart -->
  <rect x="176" y="216" width="408" height="94" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="192" y="236" font-size="10.5" fill="#71717a">lv_chart — 60 s</text>
  <polyline points="192,292 226,282 260,286 294,268 328,272 362,254 396,262 430,244 464,250 498,238 532,244 566,230"
            fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="192,298 226,294 260,296 294,288 328,292 362,284 396,288 430,280 464,284 498,278 532,282 566,274"
            fill="none" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>

  <!-- buttons -->
  <rect x="176" y="322" width="196" height="26" rx="13" fill="#2563eb"/>
  <text x="274" y="339" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Start logging</text>
  <rect x="388" y="322" width="196" height="26" rx="13" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="486" y="339" text-anchor="middle" font-size="12" font-weight="600" fill="#3f3f46">Settings</text>

  <text x="380" y="396" text-anchor="middle" font-size="11" fill="#71717a">flex layout · styles · lv_chart · lv_timer · event callbacks</text>
</svg>
