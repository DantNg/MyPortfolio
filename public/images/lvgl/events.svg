<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Luồng sự kiện / Event flow</text>

  <defs>
    <marker id="e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="24" y="72" width="140" height="66" rx="9" fill="#fefce8" stroke="#fde047"/>
  <text x="94" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#a16207">Ngón tay chạm</text>
  <text x="94" y="118" text-anchor="middle" font-size="11" fill="#3f3f46">finger / touch</text>

  <rect x="196" y="72" width="150" height="66" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="271" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#27272a">indev read_cb()</text>
  <text x="271" y="118" text-anchor="middle" font-size="10.5" fill="#71717a">x, y, PR / REL</text>

  <rect x="378" y="72" width="160" height="66" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="458" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#27272a">lv_timer_handler()</text>
  <text x="458" y="118" text-anchor="middle" font-size="10.5" fill="#71717a">tìm widget bị chạm</text>

  <rect x="570" y="72" width="166" height="66" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="653" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">event_cb(e)</text>
  <text x="653" y="118" text-anchor="middle" font-size="10.5" fill="#3f3f46">code của bạn / your code</text>

  <line x1="164" y1="105" x2="194" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#e)"/>
  <line x1="346" y1="105" x2="376" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#e)"/>
  <line x1="538" y1="105" x2="568" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#e)"/>

  <!-- event codes timeline -->
  <text x="380" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Thứ tự mã sự kiện khi nhấn một nút / event codes of one tap</text>
  <line x1="70" y1="230" x2="690" y2="230" stroke="#d4d4d8" stroke-width="2"/>

  <circle cx="110" cy="230" r="7" fill="#2563eb"/>
  <text x="110" y="256" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#27272a">PRESSED</text>
  <circle cx="265" cy="230" r="7" fill="#60a5fa"/>
  <text x="265" y="256" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#27272a">PRESSING</text>
  <text x="265" y="272" text-anchor="middle" font-size="9.5" fill="#71717a">lặp lại / repeats</text>
  <circle cx="420" cy="230" r="7" fill="#60a5fa"/>
  <text x="420" y="256" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#27272a">RELEASED</text>
  <circle cx="575" cy="230" r="9" fill="#16a34a"/>
  <text x="575" y="256" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="700" fill="#15803d">CLICKED</text>
  <text x="575" y="272" text-anchor="middle" font-size="9.5" fill="#71717a">cái bạn thường dùng / the one you want</text>

  <rect x="70" y="292" width="620" height="34" rx="8" fill="#f8fafc" stroke="#e4e4e7"/>
  <text x="86" y="314" font-size="11.5" font-family="monospace" fill="#27272a">lv_obj_add_event_cb(btn, my_cb, LV_EVENT_CLICKED, user_data);</text>
</svg>
