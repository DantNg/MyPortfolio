<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Bố cục / Layout — Align · Flex · Grid</text>

  <!-- align -->
  <text x="130" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">1. Align</text>
  <rect x="30" y="74" width="200" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="130" cy="139" r="4" fill="#a1a1aa"/>
  <rect x="40" y="84" width="46" height="22" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="63" y="99" text-anchor="middle" font-size="9" fill="#1d4ed8">TOP_LEFT</text>
  <rect x="107" y="128" width="46" height="22" rx="5" fill="#2563eb"/>
  <text x="130" y="143" text-anchor="middle" font-size="9" fill="#ffffff">CENTER</text>
  <rect x="174" y="172" width="46" height="22" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="197" y="187" text-anchor="middle" font-size="8" fill="#1d4ed8">BOTTOM_R</text>
  <text x="130" y="222" text-anchor="middle" font-size="10" font-family="monospace" fill="#52525b">lv_obj_align(o, LV_ALIGN_CENTER, 0, 0)</text>

  <!-- flex -->
  <text x="380" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">2. Flex (ROW / COLUMN)</text>
  <rect x="270" y="74" width="220" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="86" width="60" height="46" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <rect x="350" y="86" width="60" height="46" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <rect x="418" y="86" width="60" height="46" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="312" y="114" text-anchor="middle" font-size="11" fill="#1e40af">1</text>
  <text x="380" y="114" text-anchor="middle" font-size="11" fill="#1e40af">2</text>
  <text x="448" y="114" text-anchor="middle" font-size="11" fill="#1e40af">3</text>
  <path d="M282 148 L478 148" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="380" y="170" text-anchor="middle" font-size="10" fill="#52525b">tự xếp hàng, tự giãn cách</text>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#52525b">items flow &amp; wrap automatically</text>
  <text x="380" y="222" text-anchor="middle" font-size="10" font-family="monospace" fill="#52525b">lv_obj_set_flex_flow(c, LV_FLEX_FLOW_ROW)</text>

  <!-- grid -->
  <text x="630" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">3. Grid</text>
  <rect x="530" y="74" width="200" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="542" y="86" width="86" height="50" rx="6" fill="#cffafe" stroke="#67e8f9"/>
  <rect x="636" y="86" width="86" height="50" rx="6" fill="#cffafe" stroke="#67e8f9"/>
  <rect x="542" y="144" width="180" height="50" rx="6" fill="#cffafe" stroke="#67e8f9"/>
  <text x="585" y="115" text-anchor="middle" font-size="10" fill="#0e7490">r0,c0</text>
  <text x="679" y="115" text-anchor="middle" font-size="10" fill="#0e7490">r0,c1</text>
  <text x="632" y="173" text-anchor="middle" font-size="10" fill="#0e7490">r1 — span 2 cột / columns</text>
  <text x="630" y="222" text-anchor="middle" font-size="10" font-family="monospace" fill="#52525b">lv_obj_set_grid_cell(...)</text>

  <!-- size units -->
  <rect x="30" y="252" width="700" height="106" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="276" font-size="12.5" font-weight="700" fill="#1d4ed8">Đơn vị kích thước / Size units</text>
  <text x="52" y="300" font-size="11.5" font-family="monospace" fill="#27272a">lv_obj_set_width(o, 120);</text>
  <text x="300" y="300" font-size="11.5" fill="#52525b">pixel cố định / fixed pixels</text>
  <text x="52" y="322" font-size="11.5" font-family="monospace" fill="#27272a">lv_pct(50)</text>
  <text x="300" y="322" font-size="11.5" fill="#52525b">50% kích thước cha / of the parent</text>
  <text x="52" y="344" font-size="11.5" font-family="monospace" fill="#27272a">LV_SIZE_CONTENT</text>
  <text x="300" y="344" font-size="11.5" fill="#52525b">vừa khít nội dung / shrink-to-fit</text>
</svg>
