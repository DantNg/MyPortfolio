<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Vòng đời chạy LVGL / LVGL runtime loop</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- init chain -->
  <rect x="30" y="70" width="150" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="105" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">lv_init()</text>
  <text x="105" y="111" text-anchor="middle" font-size="10.5" fill="#52525b">khởi tạo thư viện</text>

  <rect x="205" y="70" width="170" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="290" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">register display</text>
  <text x="290" y="111" text-anchor="middle" font-size="10.5" fill="#52525b">draw_buf + flush_cb</text>

  <rect x="400" y="70" width="170" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="485" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">register indev</text>
  <text x="485" y="111" text-anchor="middle" font-size="10.5" fill="#52525b">read_cb (touch)</text>

  <rect x="595" y="70" width="135" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="662" y="94" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">create UI</text>
  <text x="662" y="111" text-anchor="middle" font-size="10.5" fill="#52525b">widgets</text>

  <line x1="180" y1="96" x2="203" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="375" y1="96" x2="398" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="96" x2="593" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

  <!-- loop box -->
  <rect x="130" y="160" width="500" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="380" y="184" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">while (1) — chạy mãi / forever</text>

  <rect x="152" y="200" width="210" height="76" rx="9" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="257" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="#27272a">lv_tick_inc(ms)</text>
  <text x="257" y="242" text-anchor="middle" font-size="10.5" fill="#71717a">gọi từ ngắt 1 ms</text>
  <text x="257" y="258" text-anchor="middle" font-size="10.5" fill="#71717a">called from a 1 ms tick ISR</text>

  <rect x="398" y="200" width="210" height="76" rx="9" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="503" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="#27272a">lv_timer_handler()</text>
  <text x="503" y="242" text-anchor="middle" font-size="10.5" fill="#71717a">gọi mỗi ~5 ms</text>
  <text x="503" y="258" text-anchor="middle" font-size="10.5" fill="#71717a">reads input · runs anim · draws</text>

  <line x1="662" y1="122" x2="662" y2="230" stroke="#2563eb" stroke-width="2"/>
  <line x1="662" y1="230" x2="612" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M380 276 L380 292 L118 292 L118 230 L150 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
</svg>
