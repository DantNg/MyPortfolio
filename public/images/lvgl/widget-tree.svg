<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Cây đối tượng / Object tree — mọi thứ đều là lv_obj_t</text>

  <!-- tree -->
  <rect x="40" y="60" width="330" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="70" y="80" width="200" height="38" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="170" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">lv_scr_act() — screen</text>

  <rect x="110" y="140" width="200" height="38" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="210" y="164" text-anchor="middle" font-size="12" fill="#27272a">lv_obj (container)</text>

  <rect x="150" y="200" width="180" height="34" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="240" y="222" text-anchor="middle" font-size="12" fill="#27272a">lv_label</text>

  <rect x="150" y="248" width="180" height="34" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="240" y="270" text-anchor="middle" font-size="12" fill="#27272a">lv_btn</text>

  <rect x="110" y="294" width="200" height="26" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="210" y="311" text-anchor="middle" font-size="11.5" fill="#27272a">lv_slider</text>

  <path d="M100 118 L100 159 L108 159" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
  <path d="M100 118 L100 307 L108 307" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
  <path d="M140 178 L140 217 L148 217" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
  <path d="M140 178 L140 265 L148 265" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>

  <!-- rendered result -->
  <text x="565" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Kết quả trên màn hình / on screen</text>
  <rect x="420" y="88" width="290" height="230" rx="14" fill="#27272a"/>
  <rect x="432" y="100" width="266" height="206" rx="8" fill="#f4f4f5"/>

  <rect x="452" y="120" width="226" height="166" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="565" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">Temperature</text>

  <rect x="490" y="168" width="150" height="38" rx="8" fill="#2563eb"/>
  <text x="565" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Start</text>

  <rect x="480" y="238" width="170" height="6" rx="3" fill="#e4e4e7"/>
  <rect x="480" y="238" width="102" height="6" rx="3" fill="#2563eb"/>
  <circle cx="582" cy="241" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <text x="565" y="336" text-anchor="middle" font-size="11" fill="#71717a">Cha di chuyển → con di chuyển theo / children follow their parent</text>
