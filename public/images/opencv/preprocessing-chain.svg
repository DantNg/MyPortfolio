<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Chuỗi tiền xử lý / The preprocessing chain</text>
  <text x="380" y="48" text-anchor="middle" font-size="11.5" fill="#71717a">every stage discards information the next stage does not need</text>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a21caf"/>
    </marker>
  </defs>

  <!-- 1 BGR -->
  <rect x="24" y="70" width="126" height="96" rx="9" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="38" y="84" width="98" height="52" rx="4" fill="#e4e4e7"/>
  <circle cx="64" cy="106" r="11" fill="#a1a1aa"/>
  <rect x="82" y="102" width="42" height="24" rx="3" fill="#d4d4d8"/>
  <text x="87" y="156" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3f3f46">BGR frame</text>

  <!-- 2 gray -->
  <rect x="174" y="70" width="126" height="96" rx="9" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="188" y="84" width="98" height="52" rx="4" fill="#f4f4f5"/>
  <circle cx="214" cy="106" r="11" fill="#71717a"/>
  <rect x="232" y="102" width="42" height="24" rx="3" fill="#a1a1aa"/>
  <text x="237" y="156" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3f3f46">gray + blur</text>

  <!-- 3 threshold -->
  <rect x="324" y="70" width="126" height="96" rx="9" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="338" y="84" width="98" height="52" rx="4" fill="#18181b"/>
  <circle cx="364" cy="106" r="11" fill="#ffffff"/>
  <rect x="382" y="102" width="42" height="24" rx="3" fill="#ffffff"/>
  <circle cx="428" cy="92" r="2.5" fill="#ffffff"/>
  <circle cx="345" cy="130" r="2" fill="#ffffff"/>
  <text x="387" y="156" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3f3f46">threshold</text>

  <!-- 4 morphology -->
  <rect x="474" y="70" width="126" height="96" rx="9" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="488" y="84" width="98" height="52" rx="4" fill="#18181b"/>
  <circle cx="514" cy="106" r="11" fill="#ffffff"/>
  <rect x="532" y="102" width="42" height="24" rx="3" fill="#ffffff"/>
  <text x="537" y="156" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#3f3f46">open + close</text>

  <!-- 5 contours -->
  <rect x="624" y="70" width="112" height="96" rx="9" fill="#ffffff" stroke="#d946ef" stroke-width="2.5"/>
  <rect x="636" y="84" width="88" height="52" rx="4" fill="#fafafa"/>
  <circle cx="660" cy="106" r="11" fill="none" stroke="#d946ef" stroke-width="2.5"/>
  <rect x="678" y="102" width="36" height="24" rx="3" fill="none" stroke="#d946ef" stroke-width="2.5"/>
  <text x="680" y="156" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#a21caf">contours</text>

  <g stroke="#a21caf" stroke-width="2.5" marker-end="url(#pa)">
    <line x1="152" y1="112" x2="168" y2="112"/>
    <line x1="302" y1="112" x2="318" y2="112"/>
    <line x1="452" y1="112" x2="468" y2="112"/>
    <line x1="602" y1="112" x2="618" y2="112"/>
  </g>

  <!-- data volume bar -->
  <text x="24" y="200" font-size="12" font-weight="700" fill="#a21caf">DATA PER 1080p FRAME</text>
  <g font-size="11" font-family="monospace">
    <rect x="24" y="212" width="240" height="20" rx="4" fill="#c026d3"/>
    <text x="272" y="227" fill="#3f3f46">6.2 MB — 3 channels × 8 bit</text>

    <rect x="24" y="238" width="80" height="20" rx="4" fill="#d946ef"/>
    <text x="272" y="253" fill="#3f3f46">2.1 MB — 1 channel</text>

    <rect x="24" y="264" width="10" height="20" rx="4" fill="#f0abfc"/>
    <text x="272" y="279" fill="#3f3f46">0.26 MB — 1 bit per pixel</text>

    <rect x="24" y="290" width="6" height="20" rx="2" fill="#f0abfc"/>
    <text x="272" y="305" fill="#3f3f46">~2 KB — a few hundred points</text>
  </g>
  <text x="24" y="330" font-size="11" fill="#71717a">Ask of every stage: what did this discard, and did I need it?</text>
</svg>
