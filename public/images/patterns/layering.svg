<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Xếp tầng firmware — quy tắc: phụ thuộc chỉ đi xuống</text>

  <defs>
    <marker id="ly" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="140" y="54" width="480" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Application — chính sách, máy trạng thái, thuật toán</text>
  <text x="380" y="95" text-anchor="middle" font-size="10" fill="#3f3f46">không có #include nào của nhà sản xuất chip · chạy được trên PC · test được</text>

  <rect x="140" y="130" width="480" height="56" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="380" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Device / Service — cảm biến, bộ nhớ, giao thức</text>
  <text x="380" y="171" text-anchor="middle" font-size="10" fill="#3f3f46">"đọc nhiệt độ" chứ không phải "đọc thanh ghi 0x41 của I²C"</text>

  <rect x="140" y="206" width="480" height="56" rx="9" fill="#fefce8" stroke="#fde047"/>
  <text x="380" y="228" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a16207">HAL / Port — interface + hiện thực cho từng chip</text>
  <text x="380" y="247" text-anchor="middle" font-size="10" fill="#3f3f46">i2c_if_t, uart_if_t, timer_if_t — đây là chỗ duy nhất biết chip là gì</text>

  <rect x="140" y="282" width="480" height="42" rx="9" fill="#27272a"/>
  <text x="380" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#e4e4e7">Thanh ghi · ngoại vi · silicon</text>

  <line x1="380" y1="110" x2="380" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#ly)"/>
  <line x1="380" y1="186" x2="380" y2="202" stroke="#2563eb" stroke-width="2" marker-end="url(#ly)"/>
  <line x1="380" y1="262" x2="380" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#ly)"/>

  <path d="M120 300 L120 82 L136 82" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ly)"/>
  <text x="30" y="196" font-size="10.5" font-weight="600" fill="#dc2626">cấm</text>
  <text x="30" y="212" font-size="9.5" fill="#dc2626">nhảy cóc</text>
  <text x="30" y="226" font-size="9.5" fill="#dc2626">lên trên</text>

  <rect x="636" y="54" width="100" height="270" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="686" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#18181b">Test được?</text>
  <text x="686" y="106" text-anchor="middle" font-size="11" fill="#16a34a">✔ dễ</text>
  <text x="686" y="122" text-anchor="middle" font-size="9" fill="#71717a">unit test thuần</text>
  <text x="686" y="160" text-anchor="middle" font-size="11" fill="#16a34a">✔ được</text>
  <text x="686" y="176" text-anchor="middle" font-size="9" fill="#71717a">với HAL giả</text>
  <text x="686" y="234" text-anchor="middle" font-size="11" fill="#a16207">~ khó</text>
  <text x="686" y="250" text-anchor="middle" font-size="9" fill="#71717a">cần phần cứng</text>
  <text x="686" y="300" text-anchor="middle" font-size="11" fill="#dc2626">✘ không</text>

  <rect x="24" y="340" width="712" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="380" y="360" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Phép thử nhanh: <tspan font-family="monospace">grep -rn "stm32\|esp_" src/app/</tspan> — nếu có kết quả, tầng đã bị rò rỉ.</text>
</svg>
