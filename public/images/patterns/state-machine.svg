<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Một máy trạng thái, bốn cách hiện thực</text>

  <defs>
    <marker id="sma" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- the machine -->
  <rect x="34" y="50" width="692" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="72" font-size="12" font-weight="700" fill="#18181b">Ví dụ: bộ sạc pin</text>

  <rect x="70" y="88" width="106" height="42" rx="8" fill="#e4e4e7"/>
  <text x="123" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#3f3f46">IDLE</text>

  <rect x="240" y="88" width="106" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="293" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">PRECHARGE</text>

  <rect x="410" y="88" width="106" height="42" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="463" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">FAST</text>

  <rect x="580" y="88" width="106" height="42" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="633" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">DONE</text>

  <line x1="176" y1="109" x2="236" y2="109" stroke="#2563eb" stroke-width="1.8" marker-end="url(#sma)"/>
  <text x="206" y="102" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2563eb">PLUGGED</text>
  <line x1="346" y1="109" x2="406" y2="109" stroke="#2563eb" stroke-width="1.8" marker-end="url(#sma)"/>
  <text x="376" y="102" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2563eb">V&gt;3.0</text>
  <line x1="516" y1="109" x2="576" y2="109" stroke="#2563eb" stroke-width="1.8" marker-end="url(#sma)"/>
  <text x="546" y="102" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2563eb">I&lt;0.1C</text>

  <path d="M633 130 L633 152 L123 152 L123 132" fill="none" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#sma)"/>
  <text x="378" y="165" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#71717a">UNPLUGGED (từ mọi trạng thái)</text>

  <!-- four implementations -->
  <g>
    <rect x="34" y="186" width="168" height="196" rx="9" fill="#fef2f2" stroke="#fecaca"/>
    <text x="118" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">1. switch lồng nhau</text>
    <rect x="48" y="218" width="140" height="76" rx="6" fill="#18181b"/>
    <g font-family="monospace" font-size="8" fill="#e4e4e7">
      <text x="56" y="232">switch (state) {</text>
      <text x="56" y="244"> case IDLE:</text>
      <text x="56" y="256">  switch (ev) {...}</text>
      <text x="56" y="268">  break;</text>
      <text x="56" y="280"> case FAST: ...</text>
      <text x="56" y="290">}</text>
    </g>
    <text x="118" y="314" text-anchor="middle" font-size="9.5" fill="#16a34a">0 byte phụ, dễ đọc khi nhỏ</text>
    <text x="118" y="334" text-anchor="middle" font-size="9.5" fill="#dc2626">vỡ trận từ ~6 trạng thái</text>
    <text x="118" y="354" text-anchor="middle" font-size="9.5" fill="#dc2626">dễ quên một nhánh</text>
    <text x="118" y="374" text-anchor="middle" font-size="9" fill="#71717a">≤ 5 trạng thái</text>

    <rect x="212" y="186" width="168" height="196" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="296" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">2. Bảng chuyển</text>
    <rect x="226" y="218" width="140" height="76" rx="6" fill="#18181b"/>
    <g font-family="monospace" font-size="8" fill="#e4e4e7">
      <text x="234" y="232">static const</text>
      <text x="234" y="244">trans_t T[] = {</text>
      <text x="234" y="256"> {IDLE,PLUG,PRE,f1},</text>
      <text x="234" y="268"> {PRE,VOK,FAST,f2},</text>
      <text x="234" y="280">};</text>
    </g>
    <text x="296" y="314" text-anchor="middle" font-size="9.5" fill="#16a34a">máy nằm trong DỮ LIỆU</text>
    <text x="296" y="334" text-anchor="middle" font-size="9.5" fill="#16a34a">nhìn là thấy thiếu gì</text>
    <text x="296" y="354" text-anchor="middle" font-size="9.5" fill="#16a34a">sinh được từ file mô tả</text>
    <text x="296" y="374" text-anchor="middle" font-size="9" fill="#71717a">mặc định nên dùng</text>

    <rect x="390" y="186" width="168" height="196" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="474" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">3. Con trỏ hàm</text>
    <rect x="404" y="218" width="140" height="76" rx="6" fill="#18181b"/>
    <g font-family="monospace" font-size="8" fill="#e4e4e7">
      <text x="412" y="232">typedef state_t</text>
      <text x="412" y="244"> (*handler)(ev_t);</text>
      <text x="412" y="260">handler cur = idle;</text>
      <text x="412" y="276">cur = cur(event);</text>
    </g>
    <text x="474" y="314" text-anchor="middle" font-size="9.5" fill="#16a34a">mỗi trạng thái một hàm</text>
    <text x="474" y="334" text-anchor="middle" font-size="9.5" fill="#16a34a">chuyển trạng thái = O(1)</text>
    <text x="474" y="354" text-anchor="middle" font-size="9.5" fill="#dc2626">khó nhìn ra toàn cảnh</text>
    <text x="474" y="374" text-anchor="middle" font-size="9" fill="#71717a">nhiều trạng thái, ít sự kiện</text>

    <rect x="568" y="186" width="158" height="196" rx="9" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="647" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7e22ce">4. Phân cấp (HSM)</text>
    <rect x="582" y="218" width="130" height="76" rx="6" fill="#18181b"/>
    <g font-family="monospace" font-size="8" fill="#e4e4e7">
      <text x="590" y="232">CHARGING</text>
      <text x="590" y="244"> ├ PRECHARGE</text>
      <text x="590" y="256"> └ FAST</text>
      <text x="590" y="272">UNPLUG xu ly</text>
      <text x="590" y="284">o node CHA</text>
    </g>
    <text x="647" y="314" text-anchor="middle" font-size="9.5" fill="#16a34a">không lặp lại chuyển tiếp</text>
    <text x="647" y="334" text-anchor="middle" font-size="9.5" fill="#16a34a">có entry/exit action</text>
    <text x="647" y="354" text-anchor="middle" font-size="9.5" fill="#dc2626">cần framework (QP…)</text>
    <text x="647" y="374" text-anchor="middle" font-size="9" fill="#71717a">UI, giao thức phức tạp</text>
  </g>
</svg>
