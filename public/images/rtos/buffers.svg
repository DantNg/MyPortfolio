<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Queue, Stream buffer, Message buffer — chọn cái nào</text>

  <!-- queue -->
  <rect x="24" y="52" width="230" height="180" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="139" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Queue</text>
  <text x="139" y="93" text-anchor="middle" font-size="10" fill="#52525b">phần tử cùng kích thước</text>

  <g>
    <rect x="46" y="106" width="42" height="30" rx="4" fill="#93c5fd"/>
    <rect x="92" y="106" width="42" height="30" rx="4" fill="#93c5fd"/>
    <rect x="138" y="106" width="42" height="30" rx="4" fill="#93c5fd"/>
    <rect x="184" y="106" width="42" height="30" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-dasharray="3 2"/>
  </g>
  <text x="67" y="126" text-anchor="middle" font-size="9" fill="#1e3a8a">8 B</text>
  <text x="113" y="126" text-anchor="middle" font-size="9" fill="#1e3a8a">8 B</text>
  <text x="159" y="126" text-anchor="middle" font-size="9" fill="#1e3a8a">8 B</text>

  <g font-size="10" fill="#3f3f46">
    <text x="46" y="162">✔ nhiều bên gửi / nhận</text>
    <text x="46" y="180">✔ có kiểu dữ liệu rõ ràng</text>
    <text x="46" y="198">✘ kích thước cố định</text>
    <text x="46" y="216">✘ khoá kernel mỗi lần gửi</text>
  </g>

  <!-- stream -->
  <rect x="265" y="52" width="230" height="180" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="380" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Stream buffer</text>
  <text x="380" y="93" text-anchor="middle" font-size="10" fill="#52525b">dòng byte liên tục</text>

  <rect x="287" y="106" width="186" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
  <rect x="287" y="106" width="118" height="30" rx="4" fill="#86efac"/>
  <text x="346" y="126" text-anchor="middle" font-size="9" fill="#14532d">A B C D E F G H I …</text>
  <text x="440" y="126" text-anchor="middle" font-size="9" fill="#71717a">trống</text>

  <g font-size="10" fill="#3f3f46">
    <text x="287" y="162">✔ ghi 1 byte hay 200 byte đều được</text>
    <text x="287" y="180">✔ đọc được đúng phần đang có</text>
    <text x="287" y="198">✔ không cần khoá (1 ghi, 1 đọc)</text>
    <text x="287" y="216">✘ CHỈ một bên ghi, một bên đọc</text>
  </g>

  <!-- message -->
  <rect x="506" y="52" width="230" height="180" rx="10" fill="#fefce8" stroke="#fef08a"/>
  <text x="621" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a16207">Message buffer</text>
  <text x="621" y="93" text-anchor="middle" font-size="10" fill="#52525b">thông điệp dài khác nhau</text>

  <rect x="528" y="106" width="186" height="30" rx="4" fill="#ffffff" stroke="#fde047"/>
  <rect x="528" y="106" width="56" height="30" rx="4" fill="#fde68a"/>
  <rect x="586" y="106" width="96" height="30" rx="4" fill="#fde68a"/>
  <text x="556" y="126" text-anchor="middle" font-size="8.5" fill="#92400e">12 B</text>
  <text x="634" y="126" text-anchor="middle" font-size="8.5" fill="#92400e">47 B</text>

  <g font-size="10" fill="#3f3f46">
    <text x="528" y="162">✔ giữ nguyên ranh giới thông điệp</text>
    <text x="528" y="180">✔ tốt cho khung giao thức</text>
    <text x="528" y="198">✘ +4 byte header mỗi thông điệp</text>
    <text x="528" y="216">✘ cũng chỉ 1 ghi, 1 đọc</text>
  </g>

  <!-- decision -->
  <rect x="24" y="252" width="712" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="276" font-size="12.5" font-weight="700" fill="#18181b">Quyết định trong 10 giây</text>
  <g font-size="11" fill="#3f3f46">
    <text x="46" y="300">Dữ liệu là struct cùng kiểu, có thể nhiều bên gửi</text>
    <text x="46" y="322">Byte từ UART/DMA về một task xử lý</text>
    <text x="46" y="344">Khung giao thức dài khác nhau, một bên đọc</text>
  </g>
  <g font-size="11" font-family="monospace" font-weight="600">
    <text x="430" y="300" fill="#1d4ed8">→ xQueueCreate()</text>
    <text x="430" y="322" fill="#15803d">→ xStreamBufferCreate()</text>
    <text x="430" y="344" fill="#a16207">→ xMessageBufferCreate()</text>
  </g>
</svg>
