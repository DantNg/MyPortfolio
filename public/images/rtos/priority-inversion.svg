<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Đảo ngược ưu tiên / Priority inversion</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#71717a">Task ưu tiên CAO bị chặn bởi task ưu tiên THẤP — vì một task TRUNG BÌNH xen vào</text>

  <!-- lanes -->
  <g font-size="11" font-weight="600">
    <text x="86" y="94" text-anchor="end" fill="#dc2626">H (cao)</text>
    <text x="86" y="154" text-anchor="end" fill="#a16207">M (trung bình)</text>
    <text x="86" y="214" text-anchor="end" fill="#2563eb">L (thấp)</text>
  </g>
  <line x1="96" y1="104" x2="720" y2="104" stroke="#e4e4e7"/>
  <line x1="96" y1="164" x2="720" y2="164" stroke="#e4e4e7"/>
  <line x1="96" y1="224" x2="720" y2="224" stroke="#e4e4e7"/>

  <!-- L runs, takes mutex -->
  <rect x="96" y="188" width="96" height="30" rx="4" fill="#93c5fd"/>
  <text x="144" y="208" text-anchor="middle" font-size="9.5" fill="#1e3a8a">L chạy</text>
  <path d="M120 188 L120 176" stroke="#16a34a" stroke-width="1.6"/>
  <text x="120" y="170" text-anchor="middle" font-size="9" fill="#16a34a">lấy mutex</text>

  <!-- H wakes, blocks -->
  <rect x="192" y="68" width="26" height="30" rx="4" fill="#fca5a5"/>
  <path d="M205 60 L205 66" stroke="#dc2626" stroke-width="1.6"/>
  <text x="205" y="56" text-anchor="middle" font-size="9" fill="#dc2626">H sẵn sàng</text>
  <rect x="218" y="68" width="330" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text x="383" y="88" text-anchor="middle" font-size="10" fill="#b91c1c">H BỊ CHẶN — chờ chính cái mutex đó</text>

  <!-- M preempts L -->
  <rect x="248" y="128" width="230" height="30" rx="4" fill="#fde68a"/>
  <text x="363" y="148" text-anchor="middle" font-size="10" fill="#92400e">M chạy thoải mái (không cần mutex)</text>
  <path d="M262 128 L262 116" stroke="#a16207" stroke-width="1.6"/>
  <text x="262" y="122" text-anchor="middle" font-size="9" fill="#a16207"></text>

  <!-- L resumes -->
  <rect x="478" y="188" width="70" height="30" rx="4" fill="#93c5fd"/>
  <text x="513" y="208" text-anchor="middle" font-size="9.5" fill="#1e3a8a">L tiếp</text>
  <path d="M544 188 L544 176" stroke="#16a34a" stroke-width="1.6"/>
  <text x="548" y="170" text-anchor="middle" font-size="9" fill="#16a34a">nhả mutex</text>

  <!-- H finally runs -->
  <rect x="548" y="68" width="130" height="30" rx="4" fill="#ef4444"/>
  <text x="613" y="88" text-anchor="middle" font-size="10" fill="#ffffff">H mới được chạy</text>

  <path d="M218 250 L548 250" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M218 245 L218 255 M548 245 L548 255" stroke="#dc2626" stroke-width="1.5"/>
  <text x="383" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">deadline của H trôi qua ở đây — không giới hạn được bằng phân tích</text>

  <!-- fix -->
  <rect x="96" y="286" width="624" height="80" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="116" y="308" font-size="12" font-weight="700" fill="#15803d">Cách sửa: kế thừa ưu tiên (priority inheritance)</text>
  <text x="116" y="330" font-size="11" fill="#3f3f46">Khi H chặn trên mutex mà L đang giữ, kernel tạm nâng L lên ưu tiên của H. M không xen vào được nữa.</text>
  <text x="116" y="352" font-size="11" font-family="monospace" fill="#27272a">xSemaphoreCreateMutex()  ✔ có kế thừa      xSemaphoreCreateBinary()  ✘ không có</text>
</svg>
