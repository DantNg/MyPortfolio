<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">RAM đi đâu — mỗi task một stack riêng</text>

  <!-- RAM map -->
  <rect x="34" y="54" width="220" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="144" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Bản đồ RAM</text>

  <rect x="54" y="90" width="180" height="34" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="144" y="112" text-anchor="middle" font-size="10.5" fill="#1e40af">.data / .bss (biến toàn cục)</text>

  <rect x="54" y="130" width="180" height="120" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="144" y="150" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400e">Heap của FreeRTOS</text>
  <text x="144" y="166" text-anchor="middle" font-size="9.5" fill="#3f3f46">configTOTAL_HEAP_SIZE</text>
  <rect x="66" y="176" width="156" height="20" rx="3" fill="#ffffff" stroke="#fde68a"/>
  <text x="144" y="190" text-anchor="middle" font-size="9" fill="#3f3f46">stack task A + TCB</text>
  <rect x="66" y="200" width="156" height="20" rx="3" fill="#ffffff" stroke="#fde68a"/>
  <text x="144" y="214" text-anchor="middle" font-size="9" fill="#3f3f46">stack task B + TCB</text>
  <rect x="66" y="224" width="156" height="20" rx="3" fill="#ffffff" stroke="#fde68a"/>
  <text x="144" y="238" text-anchor="middle" font-size="9" fill="#3f3f46">queue, semaphore…</text>

  <rect x="54" y="256" width="180" height="34" rx="5" fill="#e4e4e7"/>
  <text x="144" y="278" text-anchor="middle" font-size="10.5" fill="#3f3f46">stack của ISR (main stack)</text>

  <text x="144" y="314" text-anchor="middle" font-size="10" fill="#71717a">Mỗi task tốn TCB (~90 B)</text>
  <text x="144" y="328" text-anchor="middle" font-size="10" fill="#71717a">+ stack riêng của nó</text>

  <!-- stack usage -->
  <rect x="274" y="54" width="216" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="382" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181b">Một stack task</text>

  <rect x="304" y="92" width="156" height="216" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="304" y="92" width="156" height="70" fill="#fee2e2"/>
  <rect x="304" y="162" width="156" height="146" fill="#dcfce7"/>
  <line x1="304" y1="162" x2="460" y2="162" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="382" y="120" text-anchor="middle" font-size="10" fill="#b91c1c">chưa từng chạm tới</text>
  <text x="382" y="136" text-anchor="middle" font-size="10" fill="#b91c1c">(dư)</text>
  <text x="382" y="182" text-anchor="middle" font-size="10" fill="#15803d">mức cao nhất từng dùng</text>
  <text x="382" y="240" text-anchor="middle" font-size="10" fill="#15803d">đã dùng</text>
  <text x="382" y="298" text-anchor="middle" font-size="9" fill="#71717a">đỉnh stack →</text>

  <text x="382" y="328" text-anchor="middle" font-size="10" font-family="monospace" fill="#27272a">uxTaskGetStackHighWaterMark()</text>

  <!-- guidance -->
  <rect x="510" y="54" width="220" height="280" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="620" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Ăn stack nhiều nhất</text>

  <g font-size="10.5" fill="#3f3f46">
    <text x="530" y="104">• mảng cục bộ lớn</text>
    <text x="530" y="126">• printf / sprintf (~200–1000 B)</text>
    <text x="530" y="148">• số thực trên chip không có FPU</text>
    <text x="530" y="170">• đệ quy (tránh hẳn)</text>
    <text x="530" y="192">• lồng nhiều lớp hàm HAL</text>
  </g>

  <rect x="528" y="212" width="184" height="106" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="620" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Cách làm</text>
  <text x="544" y="252" font-size="10" fill="#3f3f46">1. Cho dư hẳn lúc đầu</text>
  <text x="544" y="270" font-size="10" fill="#3f3f46">2. Chạy ở tải nặng nhất</text>
  <text x="544" y="288" font-size="10" fill="#3f3f46">3. Đọc high-water mark</text>
  <text x="544" y="306" font-size="10" fill="#3f3f46">4. Cắt còn mức dùng + 30%</text>
</svg>
