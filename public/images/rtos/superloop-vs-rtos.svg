<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Superloop và RTOS — cùng ba việc, khác cách chờ</text>

  <!-- superloop -->
  <rect x="24" y="52" width="352" height="308" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="200" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Superloop</text>

  <rect x="44" y="90" width="312" height="88" rx="8" fill="#18181b"/>
  <g font-family="monospace" font-size="10.5" fill="#e4e4e7">
    <text x="58" y="110">while (1) {</text>
    <text x="58" y="126">    read_sensor();      // 2 ms</text>
    <text x="58" y="142">    update_display();   // 40 ms  &lt;-- ke</text>
    <text x="58" y="158">    handle_uart();      // bo lo goi tin</text>
    <text x="58" y="172">}</text>
  </g>

  <text x="200" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#3f3f46">Dòng thời gian</text>
  <rect x="44" y="212" width="60" height="22" rx="4" fill="#93c5fd"/>
  <text x="74" y="227" text-anchor="middle" font-size="9" fill="#1e3a8a">sensor</text>
  <rect x="106" y="212" width="180" height="22" rx="4" fill="#fca5a5"/>
  <text x="196" y="227" text-anchor="middle" font-size="9" fill="#7f1d1d">display (40 ms)</text>
  <rect x="288" y="212" width="66" height="22" rx="4" fill="#86efac"/>
  <text x="321" y="227" text-anchor="middle" font-size="9" fill="#14532d">uart</text>

  <path d="M150 250 L150 236" stroke="#dc2626" stroke-width="1.6"/>
  <text x="150" y="264" text-anchor="middle" font-size="9.5" fill="#dc2626">gói UART đến đây</text>
  <text x="150" y="278" text-anchor="middle" font-size="9.5" fill="#dc2626">→ mất, vì buffer đầy</text>

  <g font-size="11" fill="#3f3f46">
    <text x="44" y="306">• Độ trễ xấu nhất = tổng thời gian cả vòng</text>
    <text x="44" y="326">• Thêm một việc chậm là hỏng mọi thứ khác</text>
    <text x="44" y="346">• Đơn giản, ít RAM, dễ suy luận khi còn nhỏ</text>
  </g>

  <!-- rtos -->
  <rect x="392" y="52" width="344" height="308" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="564" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">RTOS</text>

  <rect x="412" y="90" width="304" height="88" rx="8" fill="#18181b"/>
  <g font-family="monospace" font-size="10.5" fill="#e4e4e7">
    <text x="426" y="110">void uart_task(void *p) {</text>
    <text x="426" y="126">    for (;;) {</text>
    <text x="426" y="142">        xQueueReceive(q, &amp;m, MAX);</text>
    <text x="426" y="158">        handle(&amp;m);   <tspan fill="#86efac">// chay ngay</tspan></text>
    <text x="426" y="172">    } }</text>
  </g>

  <text x="564" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#3f3f46">Dòng thời gian</text>
  <rect x="412" y="212" width="40" height="22" rx="4" fill="#93c5fd"/>
  <text x="432" y="227" text-anchor="middle" font-size="8.5" fill="#1e3a8a">sens</text>
  <rect x="454" y="212" width="60" height="22" rx="4" fill="#fca5a5"/>
  <rect x="516" y="212" width="34" height="22" rx="4" fill="#86efac"/>
  <text x="533" y="227" text-anchor="middle" font-size="8.5" fill="#14532d">uart</text>
  <rect x="552" y="212" width="90" height="22" rx="4" fill="#fca5a5"/>
  <text x="597" y="227" text-anchor="middle" font-size="8.5" fill="#7f1d1d">display</text>
  <rect x="644" y="212" width="40" height="22" rx="4" fill="#93c5fd"/>
  <text x="664" y="227" text-anchor="middle" font-size="8.5" fill="#1e3a8a">sens</text>

  <path d="M516 250 L516 236" stroke="#16a34a" stroke-width="1.6"/>
  <text x="530" y="264" text-anchor="middle" font-size="9.5" fill="#16a34a">gói UART đến → task ưu tiên cao</text>
  <text x="530" y="278" text-anchor="middle" font-size="9.5" fill="#16a34a">giành CPU trong vài chục µs</text>

  <g font-size="11" fill="#3f3f46">
    <text x="412" y="306">• Độ trễ xấu nhất = do ưu tiên quyết định</text>
    <text x="412" y="326">• Thêm việc mới không phá vỡ deadline cũ</text>
    <text x="412" y="346">• Đổi lại: RAM cho stack, và lỗi tranh chấp</text>
  </g>
</svg>
