<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Bốn trạng thái của một task</text>

  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Running -->
  <rect x="300" y="64" width="160" height="56" rx="10" fill="#2563eb"/>
  <text x="380" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">RUNNING</text>
  <text x="380" y="106" text-anchor="middle" font-size="10" fill="#dbeafe">đang chiếm CPU — chỉ 1 task/nhân</text>

  <!-- Ready -->
  <rect x="60" y="182" width="170" height="56" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">READY</text>
  <text x="145" y="224" text-anchor="middle" font-size="10" fill="#3f3f46">chạy được, đang xếp hàng</text>

  <!-- Blocked -->
  <rect x="530" y="182" width="170" height="56" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="615" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">BLOCKED</text>
  <text x="615" y="224" text-anchor="middle" font-size="10" fill="#3f3f46">chờ dữ liệu hoặc thời gian</text>

  <!-- Suspended -->
  <rect x="300" y="300" width="160" height="56" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="380" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#52525b">SUSPENDED</text>
  <text x="380" y="342" text-anchor="middle" font-size="10" fill="#3f3f46">bị gỡ khỏi lịch, không tự dậy</text>

  <!-- arrows -->
  <path d="M232 196 C 270 170, 280 130, 298 106" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ta)"/>
  <text x="228" y="146" font-size="10" font-family="monospace" fill="#2563eb">scheduler chọn</text>

  <path d="M312 118 C 280 150, 250 168, 228 182" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ta)"/>
  <text x="196" y="176" font-size="10" font-family="monospace" fill="#2563eb">bị task ưu tiên cao hơn giành</text>

  <path d="M462 106 C 496 132, 512 162, 528 182" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ta)"/>
  <text x="470" y="140" font-size="10" font-family="monospace" fill="#2563eb">vTaskDelay()</text>
  <text x="470" y="154" font-size="10" font-family="monospace" fill="#2563eb">xQueueReceive()</text>

  <path d="M540 172 C 500 130, 470 100, 464 88" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ta)"/>
  <text x="556" y="120" font-size="10" font-family="monospace" fill="#16a34a">dữ liệu tới / hết hạn</text>
  <text x="556" y="134" font-size="10" fill="#71717a">→ về READY</text>

  <path d="M380 122 L380 296" fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#ta)"/>
  <text x="390" y="220" font-size="10" font-family="monospace" fill="#71717a">vTaskSuspend()</text>
  <text x="390" y="252" font-size="10" font-family="monospace" fill="#71717a">vTaskResume() → READY</text>

  <!-- note -->
  <rect x="30" y="300" width="250" height="76" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="46" y="322" font-size="11" font-weight="700" fill="#1d4ed8">Điều quan trọng nhất</text>
  <text x="46" y="342" font-size="10.5" fill="#3f3f46">Task ở BLOCKED tốn 0% CPU.</text>
  <text x="46" y="358" font-size="10.5" fill="#3f3f46">Vòng while chờ cờ thì tốn 100%.</text>

  <rect x="480" y="300" width="250" height="76" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="496" y="322" font-size="11" font-weight="700" fill="#b91c1c">Task idle</text>
  <text x="496" y="342" font-size="10.5" fill="#3f3f46">Ưu tiên 0, luôn READY.</text>
  <text x="496" y="358" font-size="10.5" fill="#3f3f46">Là chỗ đặt lệnh ngủ tiết kiệm điện.</text>
</svg>
