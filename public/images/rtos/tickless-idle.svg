<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">Tickless idle — thức 1000 lần/giây để làm gì?</text>

  <!-- normal tick -->
  <text x="70" y="66" font-size="12.5" font-weight="700" fill="#b91c1c">Tick thường (1 kHz)</text>
  <line x1="70" y1="112" x2="700" y2="112" stroke="#d4d4d8" stroke-width="1.5"/>
  <g stroke="#dc2626" stroke-width="2">
    <line x1="90" y1="112" x2="90" y2="86"/>
    <line x1="126" y1="112" x2="126" y2="86"/>
    <line x1="162" y1="112" x2="162" y2="86"/>
    <line x1="198" y1="112" x2="198" y2="86"/>
    <line x1="234" y1="112" x2="234" y2="86"/>
    <line x1="270" y1="112" x2="270" y2="86"/>
    <line x1="306" y1="112" x2="306" y2="86"/>
    <line x1="342" y1="112" x2="342" y2="86"/>
    <line x1="378" y1="112" x2="378" y2="86"/>
    <line x1="414" y1="112" x2="414" y2="86"/>
    <line x1="450" y1="112" x2="450" y2="86"/>
    <line x1="486" y1="112" x2="486" y2="86"/>
    <line x1="522" y1="112" x2="522" y2="86"/>
    <line x1="558" y1="112" x2="558" y2="86"/>
    <line x1="594" y1="112" x2="594" y2="86"/>
    <line x1="630" y1="112" x2="630" y2="86"/>
    <line x1="666" y1="112" x2="666" y2="86"/>
  </g>
  <rect x="86" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="122" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="158" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="194" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="230" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="266" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="302" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="338" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="374" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="410" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="446" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="482" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="518" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="554" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="590" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="626" y="118" width="8" height="14" fill="#fca5a5"/>
  <rect x="662" y="118" width="8" height="14" fill="#fca5a5"/>
  <text x="70" y="152" font-size="10.5" fill="#3f3f46">Mỗi vạch = 1 ngắt tick: CPU thức, kiểm tra, thấy chẳng có gì, ngủ lại.</text>
  <text x="70" y="168" font-size="10.5" font-weight="600" fill="#b91c1c">Dòng tiêu thụ trung bình ~ 1,2 mA — pin CR2032 hết trong vài ngày.</text>

  <!-- tickless -->
  <text x="70" y="212" font-size="12.5" font-weight="700" fill="#15803d">Tickless idle</text>
  <line x1="70" y1="258" x2="700" y2="258" stroke="#d4d4d8" stroke-width="1.5"/>
  <g stroke="#16a34a" stroke-width="2">
    <line x1="90" y1="258" x2="90" y2="232"/>
    <line x1="378" y1="258" x2="378" y2="232"/>
    <line x1="666" y1="258" x2="666" y2="232"/>
  </g>
  <rect x="86" y="264" width="8" height="14" fill="#86efac"/>
  <rect x="374" y="264" width="8" height="14" fill="#86efac"/>
  <rect x="662" y="264" width="8" height="14" fill="#86efac"/>

  <rect x="96" y="264" width="276" height="14" rx="3" fill="#dbeafe"/>
  <text x="234" y="275" text-anchor="middle" font-size="9.5" fill="#1e40af">STOP mode — không có ngắt tick nào</text>
  <rect x="384" y="264" width="276" height="14" rx="3" fill="#dbeafe"/>
  <text x="522" y="275" text-anchor="middle" font-size="9.5" fill="#1e40af">STOP mode</text>

  <text x="70" y="300" font-size="10.5" fill="#3f3f46">Kernel tính xem task gần nhất cần thức lúc nào, đặt RTC/LPTIM đúng lúc đó rồi cho CPU ngủ sâu.</text>
  <text x="70" y="316" font-size="10.5" fill="#3f3f46">Khi tỉnh, nó bù lại số tick đã bỏ qua bằng <tspan font-family="monospace">vTaskStepTick()</tspan> — không task nào biết mình vừa bị "đóng băng".</text>
  <text x="70" y="336" font-size="10.5" font-weight="600" fill="#15803d">Dòng tiêu thụ trung bình ~ 8 µA — cùng phần cứng, cùng đoạn code ứng dụng.</text>
</svg>
