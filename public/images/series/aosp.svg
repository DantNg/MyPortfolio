<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="apbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fee7"/>
    </linearGradient>
    <radialGradient id="apglow" cx="0.7" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#65a30d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0"/>
    </radialGradient>
    <marker id="apa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d7c0f"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#apbg)"/>
  <ellipse cx="840" cy="270" rx="430" ry="300" fill="url(#apglow)"/>

  <g stroke="#65a30d" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="72" y="64" width="164" height="34" rx="17" fill="#ffffff" stroke="#d9f99d" stroke-width="2"/>
    <circle cx="94" cy="81" r="5" fill="#65a30d"/>
    <text x="108" y="86" font-size="15" font-weight="600" fill="#4d7c0f">Android AOSP</text>
  </g>

  <!-- ===== ngăn xếp Android ===== -->
  <g>
    <text x="72" y="146" font-size="13" font-weight="700" fill="#4d7c0f">THE STACK</text>

    <rect x="72" y="160" width="440" height="42" rx="9" fill="#ecfccb" stroke="#a3e635" stroke-width="2"/>
    <text x="92" y="187" font-size="14" font-weight="600" fill="#4d7c0f">Apps — Java / Kotlin</text>

    <rect x="72" y="208" width="440" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="92" y="235" font-size="14" font-weight="600" fill="#27272a">Framework — system_server</text>

    <rect x="72" y="256" width="440" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="92" y="283" font-size="14" font-weight="600" fill="#27272a">Native — libbinder · HAL clients</text>

    <rect x="72" y="304" width="440" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="92" y="331" font-size="14" font-weight="600" fill="#27272a">HAL — AIDL / HIDL · vendor</text>

    <rect x="72" y="352" width="440" height="34" rx="8" fill="#27272a"/>
    <text x="292" y="374" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e4e4e7">Linux kernel · drivers</text>

    <!-- ranh gioi Treble -->
    <path d="M60 301 L524 301" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="9 6"/>
    <rect x="368" y="286" width="150" height="22" rx="11" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="443" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">Treble boundary</text>
  </g>

  <!-- ===== Binder ===== -->
  <g>
    <rect x="560" y="130" width="568" height="182" rx="14" fill="#ffffff" stroke="#d9f99d" stroke-width="2"/>
    <text x="584" y="158" font-size="12.5" font-weight="700" fill="#4d7c0f">BINDER IPC</text>

    <rect x="584" y="176" width="128" height="52" rx="9" fill="#ecfccb" stroke="#a3e635" stroke-width="2"/>
    <text x="648" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4d7c0f">client</text>
    <text x="648" y="217" text-anchor="middle" font-size="10.5" fill="#3f3f46">proxy</text>

    <rect x="750" y="176" width="188" height="52" rx="9" fill="#27272a"/>
    <text x="844" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a3e635">/dev/binder</text>
    <text x="844" y="217" text-anchor="middle" font-size="10.5" fill="#a1a1aa">kernel driver</text>

    <rect x="976" y="176" width="128" height="52" rx="9" fill="#ecfccb" stroke="#a3e635" stroke-width="2"/>
    <text x="1040" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4d7c0f">service</text>
    <text x="1040" y="217" text-anchor="middle" font-size="10.5" fill="#3f3f46">stub</text>

    <g stroke="#4d7c0f" stroke-width="2.5" marker-end="url(#apa)">
      <line x1="714" y1="202" x2="744" y2="202"/>
      <line x1="940" y1="202" x2="970" y2="202"/>
    </g>

    <g font-family="monospace" font-size="12" fill="#52525b">
      <text x="584" y="256">transact() → Parcel → one copy → onTransact()</text>
      <text x="584" y="278" fill="#a16207">1 MB per-process buffer · 16 binder threads</text>
      <text x="584" y="298" fill="#71717a">servicemanager resolves the name → handle</text>
    </g>
  </g>

  <!-- ===== lệnh build ===== -->
  <g>
    <rect x="560" y="330" width="568" height="126" rx="14" fill="#18181b"/>
    <g font-family="monospace" font-size="14.5">
      <text x="584" y="360"><tspan fill="#a3e635">$</tspan><tspan fill="#e4e4e7"> repo init -u …/platform/manifest</tspan></text>
      <text x="584" y="386"><tspan fill="#a3e635">$</tspan><tspan fill="#e4e4e7"> source build/envsetup.sh</tspan></text>
      <text x="584" y="412"><tspan fill="#a3e635">$</tspan><tspan fill="#e4e4e7"> lunch aosp_arm64-trunk_staging-userdebug</tspan></text>
      <text x="584" y="438"><tspan fill="#a3e635">$</tspan><tspan fill="#e4e4e7"> m -j$(nproc)  </tspan><tspan fill="#71717a">« ~400 GB, a few hours</tspan></text>
    </g>
  </g>

  <!-- tiêu đề -->
  <text x="72" y="470" font-size="46" font-weight="700" fill="#18181b">Android AOSP</text>
  <text x="72" y="524" font-size="46" font-weight="700" fill="#4d7c0f">for embedded</text>
  <text x="74" y="566" font-size="18" fill="#52525b">6 lessons · build system · boot flow · Treble</text>
  <text x="74" y="592" font-size="18" fill="#52525b">Binder · system services · SELinux · debugging</text>
</svg>
