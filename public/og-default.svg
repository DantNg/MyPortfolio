    <g fill="#a1a1aa">
      <rect x="822" y="170" width="30" height="8" rx="4"/>
      <rect x="822" y="202" width="30" height="8" rx="4"/>
      <rect x="822" y="234" width="30" height="8" rx="4"/>
      <rect x="822" y="266" width="30" height="8" rx="4"/>
      <rect x="1040" y="170" width="30" height="8" rx="4"/>
      <rect x="1040" y="202" width="30" height="8" rx="4"/>
      <rect x="1040" y="234" width="30" height="8" rx="4"/>
      <rect x="1040" y="266" width="30" height="8" rx="4"/>
