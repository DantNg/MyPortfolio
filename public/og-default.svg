    <rect x="80" y="86" width="62" height="62" rx="14" fill="#2563eb"/>
    <text x="111" y="128" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">DN</text>
    <text x="160" y="128" font-size="25" font-weight="600" fill="#18181b">Dat Nguyen</text>
